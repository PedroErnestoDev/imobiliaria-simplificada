services:
  web:
    build: .
    container_name: imobiliaria-web
    ports:
      - "8083:80"
    volumes:
      - ./app:/var/www/app
      - ./public:/var/www/public
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: imobiliaria-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: imobiliaria
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123456
    volumes:
      - ./mysql-data:/var/lib/mysql
    ports:
      - "3308:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: imobiliaria-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8889:80"
    depends_on:
      - db
